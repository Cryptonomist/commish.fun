name = "commish-rpc"
main = "src/index.ts"
compatibility_date = "2026-09-07"

# Everything here is public: this file is committed. The API key is NOT here.
# It goes in as a secret, which is encrypted at rest and never shown again:
#
#     npx wrangler secret put HELIUS_API_KEY
#
# A key pasted into this file would be in git history, which is the exact
# problem this worker exists to solve, one layer further down.
[vars]
# devnet or mainnet. Defaulting to devnet in code as well, because a proxy that
# quietly talks to mainnet because a variable was unset is a worse failure than
# one that talks to the wrong test cluster.
HELIUS_CLUSTER = "devnet"

# The origins allowed to use this proxy, compared whole rather than by suffix.
# Drop the www entry once commish.fun is the primary domain in Vercel.
#
# There is no wildcard and no default. The worker refuses every request while
# this is empty, on purpose: an open proxy holding a live key is the one thing
# that must not be what happens when somebody forgets a variable.
CORS_ALLOW_ORIGIN = "https://commish.fun,https://www.commish.fun"

# Uncomment to override the RPC method allowlist. The default is the set the app
# actually calls, listed in src/index.ts. Setting this to an empty string turns
# the allowlist off, which should be a deliberate act rather than a side effect.
# ALLOWED_METHODS = ""
